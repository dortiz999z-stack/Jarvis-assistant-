
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente - Jarvis Ultimate Pro</title>
    <style>
        body {
            background: #0b0f19;
            color: #38bdf8;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-size: 26px;
        }
        #orbe {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(2, 132, 199, 0.1) 70%, rgba(11, 15, 25, 0.1) 100%);
            border-radius: 50%;
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
            transition: 0.4s ease-in-out;
        }
        .escuchando {
            opacity: 1 !important;
            transform: scale(1.15);
            background: radial-gradient(circle, #4ade80 0%, #16a34a 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 35px #22c55e !important;
        }
        .pensando {
            opacity: 1 !important;
            transform: scale(1.1);
            background: radial-gradient(circle, #c084fc 0%, #7e22ce 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 35px #c084fc !important;
        }
        .hablando {
            opacity: 1 !important;
            transform: scale(1.15);
            background: radial-gradient(circle, var(--color-principal, #38bdf8) 0%, var(--color-secundario, #0284c7) 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 35px var(--color-principal, #38bdf8) !important;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
        p {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>JARVIS</h1>
    <div id="orbe"></div>
    <p id="respuesta">Toca el botón o la pantalla para activar el sistema.</p>
    <button onclick="iniciarEscuchaTotal()">🎙️ Activar Sistema de Voz</button>

    <script>
        let tareas = [];
        let recordatorios = [];
        let velocidadVoz = 1.0;
        let linternaEncendida = false;
        let colorPrincipal = "#38bdf8";
        let colorSecundario = "#0284c7";
        let reconocimiento = null;
        let bloqueadoPorHablar = false;

        function limpiarOrbe() {
            let orbe = document.getElementById("orbe");
            orbe.className = "";
        }

        function actualizarTemaOrbe() {
            document.documentElement.style.setProperty('--color-principal', colorPrincipal);
            document.documentElement.style.setProperty('--color-secundario', colorSecundario);
        }

        function iniciarEscuchaTotal() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz.");
                return;
            }

            if (reconocimiento) {
                try { reconocimiento.stop(); } catch(e) {}
            }

            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = "es-ES";
            reconocimiento.continuous = true;
            reconocimiento.interimResults = false;

            reconocimiento.onstart = function() {
                let orbe = document.getElementById("orbe");
                limpiarOrbe();
                orbe.classList.add("escuchando");
                document.getElementById("respuesta").innerText = "Jarvis escuchando...";
            };

            reconocimiento.onresult = function(event) {
                if (bloqueadoPorHablar) return;

                let mensaje = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("Audio capturado: " + mensaje);

                if (mensaje.includes("jarvis")) {
                    let orbe = document.getElementById("orbe");
                    limpiarOrbe();
                    orbe.classList.add("pensando");
                    document.getElementById("respuesta").innerText = "Orden: " + mensaje;
                    
                    setTimeout(() => {
                        responder(mensaje);
                    }, 300);
                }
            };

            reconocimiento.onerror = function(event) {
                console.log("Error de reconocimiento: ", event.error);
            };

            reconocimiento.onend = function() {
                limpiarOrbe();
                if (!bloqueadoPorHablar) {
                    setTimeout(() => {
                        try { reconocimiento.start(); } catch(e) {}
                    }, 200);
                }
            };

            try {
                reconocimiento.start();
                document.getElementById("respuesta").innerText = "Sistema activo. Di \"Jarvis\"...";
            } catch(e) {
                document.getElementById("respuesta").innerText = "Toca el botón para arrancar.";
            }
        }

        function responder(mensaje) {
            let respuesta = "Lo siento, señor, no reconozco ese comando.";
            let textoMinus = mensaje.toLowerCase();
            let accionExtra = null;
            let orbe = document.getElementById("orbe");

            limpiarOrbe();

            if (textoMinus.includes("modo rojo") || textoMinus.includes("tema rojo")) {
                colorPrincipal = "#f87171";
                colorSecundario = "#dc2626";
                respuesta = "Modo rojo de emergencia activado, señor.";
            } else if (textoMinus.includes("modo azul") || textoMinus.includes("tema azul")) {
                colorPrincipal = "#38bdf8";
                colorSecundario = "#0284c7";
                respuesta = "Modo azul clásico activado.";
            } else if (textoMinus.includes("modo verde") || textoMinus.includes("tema verde")) {
                colorPrincipal = "#4ade80";
                colorSecundario = "#16a34a";
                respuesta = "Modo verde ecológico activado.";
            } else if (textoMinus.includes("hola")) {
                respuesta = "Buenos días, señor. Sistemas al cien por ciento.";
            } else if (textoMinus.includes("cómo estás") || textoMinus.includes("estado")) {
                respuesta = "Servidores operando con normalidad. Batería y sistemas óptimos.";
            } else if (textoMinus.includes("nombre")) {
                respuesta = "Soy Jarvis, su sistema avanzado de asistencia.";
            } else if (textoMinus.includes("gracias")) {
                respuesta = "Un placer servirle, señor.";
            } else if (textoMinus.includes("hora")) {
                let ahora = new Date();
                respuesta = `Son las ${ahora.getHours()} con ${ahora.getMinutes()} minutos, señor.`;
            } else if (textoMinus.includes("fecha") || textoMinus.includes("día es")) {
                let hoy = new Date();
                respuesta = "Hoy es " + hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            } else if (textoMinus.includes("clima") || textoMinus.includes("tiempo") || textoMinus.includes("llover")) {
                let climas = [
                    "Condiciones meteorológicas óptimas, 24 grados centígrados y cielo completamente despejado.",
                    "Sensores atmosféricos detectan ligera brisa, temperatura agradable de 21 grados.",
                    "Cielo despejado, sin probabilidades de lluvia en su zona por ahora, señor."
                ];
                respuesta = climas[Math.floor(Math.random() * climas.length)];
            } else if (textoMinus.includes("lanza una moneda") || textoMinus.includes("cara o cruz")) {
                let resultadoMoneda = Math.random() < 0.5 ? "Cara" : "Cruz";
                respuesta = `La moneda ha girado en el aire y el resultado es: ${resultadoMoneda}, señor.`;
            } else if (textoMinus.includes("motívame") || textoMinus.includes("motivacion") || textoMinus.includes("consejo")) {
                let frases = [
                    "A veces hay que correr antes de aprender a caminar, señor.",
                    "El éxito no es final, el fracaso no es fatídico: lo que cuenta es el valor para continuar.",
                    "Construimos nuestro propio futuro. Mantenga el enfoque en los objetivos, señor."
                ];
                respuesta = frases[Math.floor(Math.random() * frases.length)];
            } else if (textoMinus.includes("temporizador") || textoMinus.includes("cuenta regresiva")) {
                let match = mensaje.match(/\d+/);
                if (match) {
                    let tiempoSegundos = parseInt(match[0]);
                    if (textoMinus.includes("minuto")) tiempoSegundos *= 60;
                    respuesta = `Temporizador configurado para ${match[0]} ${textoMinus.includes("minuto") ? 'minutos' : 'segundos'}. Le avisaré cuando termine, señor.`;
                    setTimeout(() => {
                        let alertaVoz = new SpeechSynthesisUtterance("¡Atención, señor! El tiempo del temporizador ha finalizado.");
                        alertaVoz.lang = "es-ES";
                        speechSynthesis.speak(alertaVoz);
                    }, tiempoSegundos * 1000);
                } else {
                    respuesta = "No entendí cuántos segundos o minutos configurar en el temporizador.";
                }
            } else if (textoMinus.includes("enciende la linterna") || textoMinus.includes("prende la linterna")) {
                linternaEncendida = true;
                respuesta = "Encendiendo la linterna, señor.";
                navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" } })
                    .then(stream => {
                        window.streamLinterna = stream;
                        const track = stream.getVideoTracks()[0];
                        track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
                    }).catch(() => {});
            } else if (textoMinus.includes("apaga la linterna")) {
                linternaEncendida = false;
                respuesta = "Apagando la linterna, señor.";
                if (window.streamLinterna) {
                    window.streamLinterna.getTracks().forEach(track => track.stop());
                    window.streamLinterna = null;
                }
            } else if (textoMinus.includes("ecuación cuadrática") || textoMinus.includes("ecuacion cuadratica") || textoMinus.includes("segundo grado")) {
                try {
                    let limpiar = mensaje.replace("jarvis", "").replace("ecuación cuadrática", "").replace("ecuacion cuadratica", "").replace("segundo grado", "").trim();
                    let partes = limpiar.split("=");
                    let ladoIzq = partes[0].trim();
                    let matchA = ladoIzq.match(/([+-]?\d*\.?\d*)x\s*(?:\*\*|al cuadrado)/);
                    let matchB = ladoIzq.match(/([+-]?\d*\.?\d*)x(?![\s*])/);
                    let a = matchA && matchA[1] !== "" ? parseFloat(matchA[1]) : 1;
                    if(matchA && matchA[1] === "-") a = -1;
                    let b = matchB && matchB[1] !== "" ? parseFloat(matchB[1]) : 0;
                    if(matchB && matchB[1] === "-") b = -1;
                    let sinX = ladoIzq.replace(/([+-]?\d*\.?\d*)x\s*(?:\*\*|al cuadrado)/, "").replace(/([+-]?\d*\.?\d*)x/, "").trim();
                    let c = sinX !== "" ? eval(sinX) : 0;
                    let discriminante = (b * b) - (4 * a * c);
                    if (discriminante < 0) {
                        respuesta = "La ecuación tiene soluciones con números complejos, señor.";
                    } else {
                        let x1 = (-b + Math.sqrt(discriminante)) / (2 * a);
                        let x2 = (-b - Math.sqrt(discriminante)) / (2 * a);
                        if (x1 === x2) {
                            respuesta = `La ecuación tiene una única solución: x es igual a ${x1}, señor.`;
                        } else {
                            respuesta = `Las soluciones son: x uno igual a ${x1} y x dos igual a ${x2}, señor.`;
                        }
                    }
                } catch (e) {
                    respuesta = "No pude procesar esa ecuación cuadrática, señor.";
                }
            } else if (textoMinus.includes("sistema de ecuaciones") || textoMinus.includes("sistema")) {
                try {
                    let limpiar = mensaje.replace("jarvis", "").replace("sistema de ecuaciones", "").replace("sistema", "").trim();
                    let ecuaciones = limpiar.split("y");
                    if (ecuaciones.length === 2) {
                        let match1 = ecuaciones[0].trim().match(/([+-]?\d*\.?\d*)x\s*([+-]?\d*\.?\d*)y\s*=\s*([+-]?\d+\.?\d*)/);
                        let match2 = ecuaciones[1].trim().match(/([+-]?\d*\.?\d*)x\s*([+-]?\d*\.?\d*)y\s*=\s*([+-]?\d+\.?\d*)/);
                        if (match1 && match2) {
                            let a1 = match1[1] === "" || match1[1] === "+" ? 1 : match1[1] === "-" ? -1 : parseFloat(match1[1]);
                            let b1 = match1[2] === "" || match1[2] === "+" ? 1 : match1[2] === "-" ? -1 : parseFloat(match1[2]);
                            let c1 = parseFloat(match1[3]);
                            let a2 = match2[1] === "" || match2[1] === "+" ? 1 : match2[1] === "-" ? -1 : parseFloat(match2[1]);
                            let b2 = match2[2] === "" || match2[2] === "+" ? 1 : match2[2] === "-" ? -1 : parseFloat(match2[2]);
                            let c2 = parseFloat(match2[3]);
                            let determinante = (a1 * b2) - (a2 * b1);
                            if (determinante === 0) {
                                respuesta = "El sistema no tiene solución única, señor.";
                            } else {
                                let x = ((c1 * b2) - (c2 * b1)) / determinante;
                                let y = ((a1 * c2) - (a2 * c1)) / determinante;
                                respuesta = `Por reducción, x es ${x} y y es ${y}, señor.`;
                            }
                        } else {
                            respuesta = "No pude leer bien los coeficientes del sistema, señor.";
                        }
                    }
                } catch (e) {
                    respuesta = "No pude resolver el sistema, señor.";
                }
            } else if (textoMinus.includes("cuánto es") || textoMinus.includes("cuanto es")) {
                try {
                    let parteOperacion = textoMinus.split(/cuánto es|cuanto es/)[1];
                    if(parteOperacion) {
                        let operacionLimpia = parteOperacion
                            .replace(/un medio/g, "0.5")
                            .replace(/medio/g, "0.5")
                            .replace(/un cuarto/g, "0.25")
                            .replace(/tres cuartos/g, "0.75")
                            .replace(/un tercio/g, "0.333")
                            .replace(/por/g, "*")
                            .replace(/entre/g, "/")
                            .replace(/más/g, "+")
                            .replace(/menos/g, "-")
                            .replace(/al cuadrado/g, "**2")
                            .replace(/al cubo/g, "**3");

                        if (operacionLimpia.includes("raíz de") || operacionLimpia.includes("raiz de")) {
                            let numeroStr = operacionLimpia.replace(/raíz de|raiz de/g, "").replace(/[^0-9.]/g, "").trim();
                            let resultado = Math.sqrt(parseFloat(numeroStr));
                            respuesta = `La raíz cuadrada de ${numeroStr} es ${resultado}, señor.`;
                        } else {
                            let operacionFinal = operacionLimpia.replace(/[^0-9+\-*/().]/g, "").trim();
                            let resultado = Function('"use strict"; return (' + operacionFinal + ')')();
                            respuesta = `El resultado es ${resultado}, señor.`;
                        }
                    } else {
                        respuesta = "No especificó la operación, señor.";
                    }
                } catch (e) {
                    respuesta = "No pude calcular esa operación, señor.";
                }
            } else if (textoMinus.startsWith("anota") || textoMinus.startsWith("agrega tarea")) {
                let tareaNueva = mensaje.replace("jarvis", "").replace("anota", "").replace("agrega tarea", "").trim();
                if(tareaNueva) {
                    tareas.push(tareaNueva);
                    respuesta = "Tarea agregada a su organizador personal.";
                }
            } else if (textoMinus.includes("mis tareas") || textoMinus.includes("lista de tareas")) {
                if(tareas.length > 0) {
                    respuesta = "Sus tareas pendientes son: " + tareas.join(", ");
                } else {
                    respuesta = "No tiene tareas pendientes en su lista.";
                }
            } else if (textoMinus.startsWith("recuérdame") || textoMinus.startsWith("recuerdame")) {
                let rec = mensaje.replace("jarvis", "").replace("recuérdame", "").replace("recuerdame", "").trim();
                if(rec) {
                    recordatorios.push(rec);
                    respuesta = "Recordatorio guardado con éxito, señor.";
                }
            } else if (textoMinus.includes("mis recordatorios")) {
                if(recordatorios.length > 0) {
                    respuesta = "Sus recordatorios actuales son: " + recordatorios.join(", ");
                } else {
                    respuesta = "No tiene recordatorios agendados.";
                }
            } else if (textoMinus.includes("habla más rápido") || textoMinus.includes("mas rapido")) {
                velocidadVoz = 1.3;
                respuesta = "Entendido, ajustando mi velocidad de habla.";
            } else if (textoMinus.includes("habla más lento") || textoMinus.includes("mas lento")) {
                velocidadVoz = 0.8;
                respuesta = "Entendido, hablaré más pausado.";
            } else if (textoMinus.includes("velocidad normal")) {
                velocidadVoz = 1.0;
                respuesta = "Velocidad de voz restablecida.";
            } else if (textoMinus.includes("genera contraseña") || textoMinus.includes("contraseña segura")) {
                let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!";
                let pass = "";
                for (let i = 0; i < 8; i++) {
                    pass += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                respuesta = `Su contraseña generada es: ${pass}. Guárdela bien, señor.`;
            } else if (textoMinus.includes("chiste")) {
                let chistes = [
                    "¿Qué hace una abeja en el gimnasio? ¡Zumba!",
                    "¿Por qué los pájaros vuelan al sur en invierno? Porque caminando tardarían mucho."
                ];
                respuesta = chistes[Math.floor(Math.random() * chistes.length)];
            } else if (textoMinus.includes("curiosidad")) {
                respuesta = "Las torres de alta tensión zumban debido a la vibración del metal por la electricidad.";
            } else if (textoMinus.includes("abre youtube")) {
                respuesta = "Abriendo Yo
