<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente - Jarvis Manos Libres</title>
    <style>
        body {
            background: #0b0f19;
            color: #38bdf8;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-size: 28px;
        }
        #orbe {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(2, 132, 199, 0.1) 70%, rgba(11, 15, 25, 0.1) 100%);
            border-radius: 50%;
            margin: 30px auto;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            transition: 0.3s ease-in-out;
        }
        .escuchando {
            background: radial-gradient(circle, #4ade80 0%, #16a34a 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 40px #22c55e !important;
            transform: scale(1.1);
        }
        .pensando {
            background: radial-gradient(circle, #c084fc 0%, #7e22ce 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 40px #c084fc !important;
            transform: scale(1.1);
        }
        .hablando {
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 70%, #0b0f19 100%) !important;
            box-shadow: 0 0 40px #38bdf8 !important;
            transform: scale(1.1);
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        p {
            color: #e2e8f0;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>JARVIS</h1>
    <div id="orbe"></div>
    <p id="respuesta">Toca una vez para activar el modo manos libres.</p>
    <button onclick="iniciarManosLibres()">🎙️ Activar Manos Libres</button>

    <script>
        let reconocimiento = null;
        let estaHablando = false;

        function limpiarOrbe() {
            document.getElementById("orbe").className = "";
        }

        function iniciarManosLibres() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
                return;
            }

            reconocimiento = new SpeechRecognition();
            reconocimiento.lang = "es-ES";
            reconocimiento.continuous = true; // Permite que siga escuchando solo
            reconocimiento.interimResults = false;

            reconocimiento.onstart = function() {
                if (!estaHablando) {
                    let orbe = document.getElementById("orbe");
                    limpiarOrbe();
                    orbe.classList.add("escuchando");
                    document.getElementById("respuesta").innerText = "Modo manos libres activo. Di \"Jarvis\"...";
                }
            };

            reconocimiento.onresult = function(event) {
                if (estaHablando) return; // Si Jarvis está hablando, ignora el ruido de fondo

                let mensaje = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("Audio capturado: " + mensaje);

                // Revisa si mencionas la palabra clave "jarvis"
                if (mensaje.includes("jarvis")) {
                    let orbe = document.getElementById("orbe");
                    limpiarOrbe();
                    orbe.classList.add("pensando");
                    document.getElementById("respuesta").innerText = "Escuchado: " + mensaje;

                    // Pausamos momentáneamente el reconocimiento mientras procesa y responde
                    try { reconocimiento.stop(); } catch(e) {}

                    setTimeout(() => {
                        responder(mensaje);
                    }, 300);
                }
            };

            reconocimiento.onerror = function(event) {
                // Si ocurre un corte de red o silencio prolongado, el sistema reintentará solo
                console.log("Error de audio: ", event.error);
            };

            reconocimiento.onend = function() {
                // Si Jarvis NO está hablando, vuelve a encender el micrófono automáticamente de inmediato
                if (!estaHablando) {
                    setTimeout(() => {
                        try {
                            reconocimiento.start();
                        } catch(e) {}
                    }, 200);
                }
            };

            try {
                reconocimiento.start();
                document.getElementById("respuesta").innerText = "Sistema escuchando en segundo plano...";
            } catch(e) {
                document.getElementById("respuesta").innerText = "Toca el botón para arrancar.";
            }
        }

        function responder(mensaje) {
            estaHablando = true; // Bloquea el micrófono para que Jarvis no se escuche a sí mismo
            let respuesta = "Lo siento, señor, no reconozco ese comando.";
            let textoMinus = mensaje.toLowerCase();
            let accionExtra = null;
            let orbe = document.getElementById("orbe");

            if (textoMinus.includes("hola")) {
                respuesta = "Buenos días, señor. Sistemas activos.";
            } else if (textoMinus.includes("cómo estás") || textoMinus.includes("estado")) {
                respuesta = "Servidores operando al cien por ciento, señor.";
            } else if (textoMinus.includes("nombre")) {
                respuesta = "Soy Jarvis, su sistema avanzado de asistencia.";
            } else if (textoMinus.includes("hora")) {
                let ahora = new Date();
                respuesta = `Son las ${ahora.getHours()} con ${ahora.getMinutes()} minutos, señor.`;
            } else if (textoMinus.includes("fecha") || textoMinus.includes("día es")) {
                let hoy = new Date();
                respuesta = "Hoy es " + hoy.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            } else if (textoMinus.includes("clima") || textoMinus.includes("tiempo")) {
                respuesta = "Condiciones óptimas, 24 grados y cielo despejado, señor.";
            } else if (textoMinus.includes("enciende la linterna") || textoMinus.includes("prende la linterna")) {
                respuesta = "Encendiendo la linterna, señor.";
                navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" } })
                    .then(stream => {
                        window.streamLinterna = stream;
                        const track = stream.getVideoTracks()[0];
                        track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
                    }).catch(() => {});
            } else if (textoMinus.includes("apaga la linterna")) {
                respuesta = "Apagando la linterna, señor.";
                if (window.streamLinterna) {
                    window.streamLinterna.getTracks().forEach(track => track.stop());
                    window.streamLinterna = null;
                }
            } else if (textoMinus.includes("cuenta")) {
                let match = mensaje.match(/\d+/);
                if (match) {
                    let hasta = parseInt(match[0]);
                    respuesta = `Entendido, contando hasta ${hasta}, señor.`;
                    
                    document.getElementById("respuesta").innerText = respuesta;
                    let vozInicio = new SpeechSynthesisUtterance(respuesta);
                    vozInicio.lang = "es-ES";
                    
                    vozInicio.onend = function() {
                        let actual = 1;
                        let intervalo = setInterval(() => {
                            if (actual <= hasta) {
                                document.getElementById("respuesta").innerText = `Contando: ${actual}`;
                                let vozNum = new SpeechSynthesisUtterance(actual.toString());
                                vozNum.lang = "es-ES";
                                speechSynthesis.speak(vozNum);
                                actual++;
                            } else {
                                clearInterval(intervalo);
                                document.getElementById("respuesta").innerText = "Conteo finalizado, señor.";
                                estaHablando = false;
                                try { reconocimiento.start(); } catch(e) {}
                            }
                        }, 1000);
                    };
                    speechSynthesis.speak(vozInicio);
                    return;
                } else {
                    respuesta = "Por favor, indique el número para contar, señor.";
                }
            } else if (textoMinus.includes("cuánto es") || textoMinus.includes("cuanto es")) {
                try {
                    let parteOperacion = textoMinus.split(/cuánto es|cuanto es/)[1];
                    if(parteOperacion) {
                        let operacionLimpia = parteOperacion
                            .replace(/un medio/g, "0.5")
                            .replace(/medio/g, "0.5")
                            .replace(/un cuarto/g, "0.25")
                            .replace(/tres cuartos/g, "0.75")
                            .replace(/por/g, "*")
                            .replace(/entre/g, "/")
                            .replace(/más/g, "+")
                            .replace(/menos/g, "-")
                            .replace(/al cuadrado/g, "**2");

                        if (operacionLimpia.includes("raíz de") || operacionLimpia.includes("raiz de")) {
                            let numeroStr = operacionLimpia.replace(/raíz de|raiz de/g, "").replace(/[^0-9.]/g, "").trim();
                            let resultado = Math.sqrt(parseFloat(numeroStr));
                            respuesta = `La raíz cuadrada es ${resultado}, señor.`;
                        } else {
                            let operacionFinal = operacionLimpia.replace(/[^0-9+\-*/().]/g, "").trim();
                            let resultado = Function('"use strict"; return (' + operacionFinal + ')')();
                            respuesta = `El resultado es ${resultado}, señor.`;
                        }
                    }
                } catch (e) {
                    respuesta = "No pude calcular esa operación, señor.";
                }
            } else if (textoMinus.includes("chiste")) {
                respuesta = "¿Qué hace una abeja en el gimnasio? ¡Zumba!";
            } else if (textoMinus.includes("abre youtube")) {
                respuesta = "Abriendo YouTube, señor.";
                accionExtra = "https://youtube.com";
            } else if (textoMinus.includes("abre google")) {
                respuesta = "Abriendo Google, señor.";
                accionExtra = "https://google.com";
            }

            orbe.classList.add("hablando");
            document.getElementById("respuesta").innerText = respuesta;

            let voz = new SpeechSynthesisUtterance(respuesta);
            voz.lang = "es-ES";
            voz.rate = 1.0;

            let voces = speechSynthesis.getVoices();
            if (voces.length > 0) {
                let espanol = voces.filter(v => v.lang.startsWith('es'));
                voz.voice = espanol.length > 1 ? espanol[1] : espanol[0];
            }

            voz.onend = function() {
                limpiarOrbe();
                if (accionExtra) {
                    window.open(accionExtra, '_blank');
                }
                // Liberamos el bloqueo y reiniciamos el micrófono automáticamente
                estaHablando = false;
                try {
                    reconocimiento.start();
                } catch(e) {}
            };

            speechSynthesis.speak(voz);
        }
    </script>
</body>
</html>
